<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quản lý thiệp cưới</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap">
<link rel="stylesheet" href="style.css">
<style>body{margin:0}</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" autocomplete="off">
    <h1>Quản lý thiệp</h1>
    <p>Đăng nhập bằng token GitHub có quyền ghi vào kho chứa thiệp. Cách tạo token có trong README.</p>
    <div class="two">
      <label class="fl">Tài khoản GitHub<input id="owner" required placeholder="ten-ban"></label>
      <label class="fl">Tên kho<input id="repo" required placeholder="thiep-cuoi"></label>
    </div>
    <label class="fl">Nhánh<input id="branch" value="main"></label>
    <label class="fl">Token<input type="password" id="token" required placeholder="github_pat_..."></label>
    <label class="chk"><input type="checkbox" id="remember"> Ghi nhớ trên máy này</label>
    <div class="err" id="loginErr"></div>
    <button class="btn pri" type="submit">Đăng nhập</button>
    <a href="./" style="font-size:13px;color:var(--ui-muted);text-align:center">Về trang thiệp</a>
  </form>
</div>
<div id="app"></div>
<div id="ui"></div>
<script src="invite.js"></script>
<script src="admin.js"></script>
</body>
</html>
